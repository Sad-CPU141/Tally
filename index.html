<!doctype html>
<html lang="en" data-theme="dark" data-accent="ice">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Tally</title>
  <meta name="description" content="Tally — gym and macro tracker">
  <meta name="theme-color" content="#0d1014">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tally">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/geist.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/archivo.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Apply saved theme before first paint so there's no flash.
    try {
      var s = JSON.parse(localStorage.getItem('tally.look') || '{}');
      if (s.theme === 'system') document.documentElement.removeAttribute('data-theme');
      else if (s.theme) document.documentElement.setAttribute('data-theme', s.theme);
      if (s.accent) document.documentElement.setAttribute('data-accent', s.accent);
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app">
    <div class="boot"><span class="boot-mark">Tally</span></div>
  </div>
  <script type="module" src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (r) { r.update(); }).catch(function () {}); });
    }
  </script>
  <script>
    // No pinch or double-tap zoom: it's an app, not a web page. (iOS ignores user-scalable=no in Safari.)
    ['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
    document.addEventListener('touchmove', e => { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });
  </script>
</body>
</html>
